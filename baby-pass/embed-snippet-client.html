<!--
  BABY PASS FAMILY GUIDE embed.
  Goes on: modcollective.org/babypass/client
  (a child page of /babypass: create it with Page Attributes -> Parent ->
  BABY PASS, and slug "client")

  WHO SEES IT: families. This address is on the card, in IQPay's resource
  link, and in the welcome text, so don't change the slug after launch.
  Spanish opens with modcollective.org/babypass/client#es.

  Never put a staff snippet on this page: the staff pages carry eligibility
  rules that families should not be handed.

  SETUP
  1. Edit the page in Elementor. Gear icon (Page Settings) -> Page Layout ->
     Elementor Canvas. The page carries its own BABY PASS header and footer,
     so it shouldn't also get the MOD ones.
  2. Section or Container: Content Width Full Width, Padding 0, Margin 0.
     The HTML widget: Padding 0, Margin 0.
  3. Paste this whole file into the HTML widget and save while logged in as
     an Administrator. Otherwise WordPress strips the script, and the frame
     stays at its starting height and scrolls inside.

  The buttons between the staff pages go to the /babypass/... addresses
  when framed here. Content changes happen by pushing to the
  resource-center repo; this is pasted once and never needs editing.

  BEFORE LAUNCH: keep the page unpublished or password protected until the
  pages are signed off.
-->

<iframe
  id="bp-client"
  src="https://babypass.netlify.app/families.html"
  title="Your BABY PASS"
  style="width:100%; border:0; display:block; min-height:900px; height:4800px;"></iframe>

<script>
(function () {
  var frame = document.getElementById('bp-client');
  var allowed = 'https://babypass.netlify.app';
  if (!frame) return;

  window.addEventListener('message', function (e) {
    // Only trust messages from our own frame, on the expected origin.
    if (e.origin !== allowed) return;
    if (e.source !== frame.contentWindow) return;
    if (!e.data || typeof e.data !== 'object') return;

    // The page reports its height, so the frame fits with no inner scrollbar.
    if (e.data.bpHeight) {
      var h = parseInt(e.data.bpHeight, 10);
      // Ignore nonsense values rather than collapsing the page around them.
      if (!isNaN(h) && h > 200 && h < 30000) {
        frame.style.height = (h + 20) + 'px';
      }
    }

    // In-page links and "next section" ask the MOD page to scroll.
    if (typeof e.data.bpScrollTo === 'number') {
      var top = frame.getBoundingClientRect().top + window.pageYOffset + e.data.bpScrollTo;
      window.scrollTo({ top: Math.max(0, top), behavior: 'smooth' });
    }
  });
})();
</script>
