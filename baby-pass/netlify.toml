[build]
  publish = "."
  functions = "netlify/functions"

# Kept out of search on purpose, launch included: the public addresses are the
# modcollective.org/babypass-* pages that frame these, and the staff pages
# shouldn't be in search at all. robots.txt says the same.
#
# frame-ancestors controls who may iframe these pages. Add a domain to the end
# of that line if the pages get embedded somewhere, e.g. an IDOH or MOD page.
[[headers]]
  for = "/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Content-Security-Policy = "frame-ancestors 'self' https://modcollective.org https://*.modcollective.org"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# The card art is for IQPay, not for the public site.
[[redirects]]
  from = "/card/*"
  to = "/404"
  status = 404
  force = true
